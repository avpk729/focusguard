<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get back to work.</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --accent: #c8f03c;
    --text: #f0f0f0;
    --muted: #444;
    --red: #ff3c3c;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
  }

  /* GRID BACKGROUND */
  .grid-bg {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(200,240,60,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200,240,60,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }

  /* SCANLINES */
  .scanlines {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.15) 2px,
      rgba(0,0,0,0.15) 4px
    );
    pointer-events: none;
    z-index: 1;
  }

  /* NOISE */
  .noise {
    position: fixed;
    inset: -50%;
    width: 200%; height: 200%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    animation: noiseDrift 8s steps(1) infinite;
  }

  @keyframes noiseDrift {
    0%, 100% { transform: translate(0, 0); }
    10% { transform: translate(-2%, -3%); }
    20% { transform: translate(3%, 1%); }
    30% { transform: translate(-1%, 4%); }
    40% { transform: translate(2%, -2%); }
    50% { transform: translate(-3%, 0); }
    60% { transform: translate(1%, 3%); }
    70% { transform: translate(-2%, -1%); }
    80% { transform: translate(3%, 2%); }
    90% { transform: translate(-1%, -4%); }
  }

  .container {
    position: relative;
    z-index: 10;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    padding: 40px 20px;
  }

  /* BIG HEADLINE */
  .headline {
    font-family: 'Bebas Neue', cursive;
    font-size: clamp(80px, 15vw, 200px);
    line-height: 0.9;
    color: var(--accent);
    text-align: center;
    letter-spacing: 2px;
    animation: glitch 6s infinite;
    position: relative;
  }

  @keyframes glitch {
    0%, 94%, 100% { text-shadow: none; transform: none; }
    95% {
      text-shadow: 3px 0 var(--red), -3px 0 #3cf;
      transform: skewX(-2deg);
    }
    96% {
      text-shadow: -3px 0 var(--red), 3px 0 #3cf;
      transform: skewX(2deg);
    }
    97% { text-shadow: none; transform: none; }
    98% {
      text-shadow: 2px 0 var(--red);
      transform: skewX(-1deg);
    }
  }

  .sub {
    font-family: 'Space Mono', monospace;
    font-size: clamp(11px, 1.5vw, 15px);
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 8px;
    margin-bottom: 48px;
  }

  /* SHAME QUOTE */
  .quote-box {
    border: 1px solid rgba(200,240,60,0.2);
    padding: 20px 28px;
    max-width: 540px;
    text-align: center;
    position: relative;
    margin-bottom: 40px;
    animation: fadeInUp 0.8s ease 0.2s both;
  }

  .quote-box::before {
    content: '';
    position: absolute;
    top: -1px; left: 30px; right: 30px;
    height: 1px;
    background: var(--bg);
  }

  .quote-corner {
    position: absolute;
    font-family: 'Space Mono', monospace;
    font-size: 18px;
    color: var(--accent);
    line-height: 1;
  }
  .quote-corner.tl { top: -10px; left: -2px; }
  .quote-corner.tr { top: -10px; right: -2px; }
  .quote-corner.bl { bottom: -10px; left: -2px; }
  .quote-corner.br { bottom: -10px; right: -2px; }

  .quote-text {
    font-family: 'Space Mono', monospace;
    font-style: italic;
    font-size: clamp(12px, 1.6vw, 14px);
    color: var(--text);
    line-height: 1.7;
    margin-bottom: 10px;
  }

  .quote-attr {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  /* STATS ROW */
  .stats-row {
    display: flex;
    gap: 40px;
    margin-bottom: 40px;
    animation: fadeInUp 0.8s ease 0.4s both;
  }

  .stat {
    text-align: center;
  }

  .stat-val {
    font-family: 'Bebas Neue', cursive;
    font-size: 36px;
    color: var(--accent);
    line-height: 1;
  }

  .stat-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* BACK BUTTON */
  .back-btn {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--bg);
    background: var(--accent);
    border: none;
    padding: 12px 32px;
    cursor: pointer;
    transition: all 0.15s;
    animation: fadeInUp 0.8s ease 0.6s both;
  }
  .back-btn:hover {
    background: #fff;
    letter-spacing: 4px;
  }

  .site-name {
    font-family: 'Bebas Neue', cursive;
    font-size: clamp(14px, 2vw, 18px);
    color: var(--red);
    letter-spacing: 3px;
    margin-bottom: 4px;
    animation: fadeInUp 0.5s ease both;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* COUNTDOWN */
  .countdown {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 16px;
    animation: fadeInUp 0.8s ease 0.8s both;
  }

  .countdown span {
    color: var(--accent);
  }
</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="scanlines"></div>
<div class="noise"></div>

<div class="container">

  <div class="site-name" id="siteName">BLOCKED</div>
  <div class="headline">NO.</div>
  <div class="sub">FocusGuard • Site Blocked</div>

  <div class="quote-box">
    <span class="quote-corner tl">⌐</span>
    <span class="quote-corner tr">¬</span>
    <span class="quote-corner bl">└</span>
    <span class="quote-corner br">┘</span>
    <div class="quote-text" id="quoteText">"The successful warrior is the average man, with laser-like focus."</div>
    <div class="quote-attr" id="quoteAttr">— Bruce Lee</div>
  </div>

  <div class="stats-row">
    <div class="stat">
      <div class="stat-val" id="blockCount">—</div>
      <div class="stat-label">Blocked today</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="currentTime">—</div>
      <div class="stat-label">Current time</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="streakDays">—</div>
      <div class="stat-label">Focus streak</div>
    </div>
  </div>

  <button class="back-btn" onclick="history.back()">← Go Back</button>

  <div class="countdown" id="countdown"></div>

</div>

<script>
const QUOTES = [
  { text: "The successful warrior is the average man, with laser-like focus.", attr: "Bruce Lee" },
  { text: "You will never find time for anything. If you want time, you must make it.", attr: "Charles Brixton" },
  { text: "It's not that I'm so smart, it's just that I stay with problems longer.", attr: "Albert Einstein" },
  { text: "The way to get started is to quit talking and begin doing.", attr: "Walt Disney" },
  { text: "Do the hard jobs first. The easy jobs will take care of themselves.", attr: "Dale Carnegie" },
  { text: "Focus is a matter of deciding what things you're not going to do.", attr: "John Carmack" },
  { text: "A year from now you may wish you had started today.", attr: "Karen Lamb" },
  { text: "The secret of getting ahead is getting started.", attr: "Mark Twain" },
  { text: "You don't have to be great to start, but you have to start to be great.", attr: "Zig Ziglar" },
  { text: "Stop checking social media and go write your thesis.", attr: "Your future self" },
  { text: "Every hour you waste scrolling is an hour your competitors are working.", attr: "Anonymous" },
  { text: "Your PhD won't write itself. Unfortunately.", attr: "FocusGuard" },
];

// Pick a random quote
const q = QUOTES[Math.floor(Math.random() * QUOTES.length)];
document.getElementById("quoteText").textContent = `"${q.text}"`;
document.getElementById("quoteAttr").textContent = `— ${q.attr}`;

// Get site name from referrer or URL
const ref = document.referrer;
let siteName = "that site";
const siteMap = {
  "twitter.com": "Twitter",  "x.com": "X (Twitter)",
  "instagram.com": "Instagram", "reddit.com": "Reddit",
  "youtube.com": "YouTube", "facebook.com": "Facebook",
  "tiktok.com": "TikTok", "snapchat.com": "Snapchat",
  "twitch.tv": "Twitch", "pinterest.com": "Pinterest",
  "linkedin.com": "LinkedIn", "tumblr.com": "Tumblr"
};
for (const [domain, name] of Object.entries(siteMap)) {
  if (ref.includes(domain)) { siteName = name; break; }
}
document.getElementById("siteName").textContent = `🚫 ${siteName}`;
document.title = `Blocked: ${siteName}`;

// Clock
function updateClock() {
  const now = new Date();
  document.getElementById("currentTime").textContent =
    now.toLocaleTimeString("en-AU", { hour: "2-digit", minute: "2-digit", hour12: false });
}
updateClock();
setInterval(updateClock, 1000);

// Block count + streak from storage
chrome.storage.local.get(["blockCount", "blockDate", "streakDays", "lastBlockDay"]).then(data => {
  const today = new Date().toDateString();

  let count = 1;
  if (data.blockDate === today && data.blockCount) {
    count = data.blockCount + 1;
  }

  // Streak logic
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  let streak = 1;
  if (data.lastBlockDay === yesterday.toDateString()) {
    streak = (data.streakDays || 0) + 1;
  } else if (data.lastBlockDay === today) {
    streak = data.streakDays || 1;
  }

  chrome.storage.local.set({
    blockCount: count,
    blockDate: today,
    streakDays: streak,
    lastBlockDay: today
  });

  document.getElementById("blockCount").textContent = count;
  document.getElementById("streakDays").textContent = streak + "d";
});

function formatDetoxRemaining(ms) {
  const totalSec = Math.max(0, Math.ceil(ms / 1000));
  const d = Math.floor(totalSec / 86400);
  const h = Math.floor((totalSec % 86400) / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const parts = [];
  if (d) parts.push(d + "d");
  if (d || h) parts.push(h + "h");
  parts.push(m + "m");
  return parts.join(" ");
}

function renderCountdown(settings) {
  const el = document.getElementById("countdown");
  if (!settings) return;

  const now = Date.now();
  if (settings.lockUntil && now < settings.lockUntil) {
    const label = formatDetoxRemaining(settings.lockUntil - now);
    el.innerHTML = `Detox lock ends in <span>${label}</span>`;
    return;
  }

  if (!settings.scheduleEnabled || !settings.enabled) {
    el.innerHTML = "";
    return;
  }

  const nowDate = new Date();
  const [eh, em] = settings.scheduleEnd.split(":").map(Number);
  const end = new Date();
  end.setHours(eh, em, 0, 0);

  if (end > nowDate) {
    const diff = Math.round((end - nowDate) / 60000);
    const h = Math.floor(diff / 60);
    const m = diff % 60;
    const label = h > 0 ? `${h}h ${m}m` : `${m}m`;
    el.innerHTML =
      `Blocking ends in <span>${label}</span> at <span>${settings.scheduleEnd}</span>`;
  }
}

Promise.all([
  chrome.storage.sync.get("settings"),
  chrome.storage.local.get(["lockUntil", "detoxDays"])
]).then(([{ settings }, local]) => {
  const s = settings || {};
  const localUntil = Number(local.lockUntil) || 0;
  if (localUntil > (s.lockUntil || 0)) {
    s.lockUntil = localUntil;
    s.detoxDays = Number(local.detoxDays) || s.detoxDays;
  }
  renderCountdown(s);
  if (s.lockUntil && Date.now() < s.lockUntil) {
    setInterval(() => renderCountdown(s), 30000);
  }
}).catch(() => {});
</script>
</body>
</html>
